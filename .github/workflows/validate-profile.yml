name: Validate Student Profile PR

on:
  pull_request:
    branches: [ dev ]
    paths:
      - '_data/people.yml'
      - 'assets/images/people/**'

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyyaml pillow

      - name: Run Profile and Image Validations
        run: |
          python - << 'EOF'
          import os
          import re
          import sys
          import yaml
          from PIL import Image

          # Schema: faculty/students need name, role, affiliation (alumni may omit
          # affiliation/image); students also need `tenure`.
          VALID_TENURE = ["current", "past", "alum"]
          IMG_PREFIX = "assets/images/people/"

          errors = []
          referenced_images = set()

          # 1. Validate _data/people.yml syntax and schema
          yaml_path = "_data/people.yml"
          if os.path.exists(yaml_path):
              try:
                  with open(yaml_path, "r", encoding="utf-8") as f:
                      data = yaml.safe_load(f)

                  if not isinstance(data, dict) or "students" not in data:
                      errors.append("`_data/people.yml` must contain a top-level `students:` key.")
                  else:
                      for section in ("faculty", "students"):
                          for idx, person in enumerate(data.get(section) or []):
                              name = person.get("name", f"{section} #{idx+1}")
                              tenure = str(person.get("tenure", "")).strip()
                              is_alum = tenure == "alum"

                              required = ["name", "role"]
                              if section == "students":
                                  required.append("tenure")
                              if not is_alum:
                                  required += ["affiliation", "image"]
                              missing = [f for f in required if str(person.get(f, "")).strip() == ""]
                              if missing:
                                  errors.append(f"Entry '{name}': Missing required field(s): {', '.join(missing)}.")

                              if section == "students" and tenure and tenure not in VALID_TENURE:
                                  errors.append(f"Entry '{name}': `tenure` must be one of {VALID_TENURE} (found '{tenure}').")

                              link = person.get("link")
                              if link and not str(link).startswith(("http://", "https://")):
                                  errors.append(f"Entry '{name}': `link` must start with 'http://' or 'https://' (found '{link}').")

                              img_path = person.get("image")
                              if img_path:
                                  img_filename = os.path.basename(img_path)
                                  referenced_images.add(img_filename)
                                  if not str(img_path).replace("\\", "/").startswith(IMG_PREFIX):
                                      errors.append(f"Entry '{name}': `image` path must start with '{IMG_PREFIX}' (found '{img_path}').")
                                  if not os.path.isfile(os.path.join("assets", "images", "people", img_filename)):
                                      errors.append(
                                          f"Entry '{name}' references '{img_filename}', but no matching file exists in "
                                          f"'assets/images/people/'. Check for case or extension mismatches."
                                      )
              except Exception as e:
                  errors.append(f"`_data/people.yml` syntax error: {e}")
          else:
              errors.append("`_data/people.yml` file was not found.")

          # 2. Validate images on disk
          img_dir = os.path.join("assets", "images", "people")
          if os.path.exists(img_dir):
              for fname in os.listdir(img_dir):
                  if fname.startswith("."): # Skip hidden files like .gitkeep
                      continue
                  
                  # Check for uploaded images missing from people.yml
                  if fname not in referenced_images:
                      errors.append(f"Image 'assets/images/people/{fname}' was uploaded, but is not listed in `_data/people.yml`.")

                  # Filename format check: lowercase, numbers, hyphens only
                  if not re.match(r"^[a-z0-9\-]+\.(jpg|jpeg|png)$", fname):
                      errors.append(f"Image '{fname}': Filename must be lowercase with hyphens only (e.g., 'sd.jpg').")

                  # Square ratio check (within 5% tolerance)
                  fpath = os.path.join(img_dir, fname)
                  try:
                      with Image.open(fpath) as img:
                          w, h = img.size
                          if abs(w - h) > (max(w, h) * 0.05):
                              errors.append(f"Image '{fname}': Must have a square aspect ratio (~400x400 px). Current resolution is {w}x{h} px.")
                  except Exception:
                      errors.append(f"Image '{fname}': Invalid or unreadable image file.")

          if errors:
              print("❌ PROFILE VALIDATION FAILED:\n")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)

          print("✅ All profile validations passed successfully!")
          EOF
